name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.runtime/browsers
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: installer chromium sur linux
        if: runner.os == 'Linux'
        run: npm exec playwright install --with-deps chromium
      - name: installer chromium sur windows
        if: runner.os == 'Windows'
        run: npm exec playwright install chromium
      - name: vérifier chromium
        run: node scripts/check-browser.mjs
      - name: installer et vérifier le tunnel windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node scripts/install-tunnel-client.mjs
          & .\.runtime\tunnel-client\tunnel-client.exe help quickstart | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Le client du tunnel Windows ne démarre pas." }
      - name: vérifier le service windows en arrière-plan
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node scripts/windows-service.cjs restart
          if ($LASTEXITCODE -ne 0) { throw "Le service Windows ne démarre pas." }
          $status = node scripts/windows-service.cjs status
          if ($LASTEXITCODE -ne 0 -or $status.Trim() -ne "active") { throw "Le service Windows ne répond pas." }
          $response = Invoke-WebRequest "http://127.0.0.1:37421/health" -UseBasicParsing -TimeoutSec 5
          if ($response.StatusCode -ne 200) { throw "Impossible de joindre l'interface Windows." }
      - name: vérifier powershell et dpapi
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\install.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw (($errors | ForEach-Object { $_.Message }) -join "`n") }
          node --input-type=module -e "import('./dist/src/storage/windows-dpapi.js').then(async m => { const value = Buffer.from('pronoteconnect'); const encrypted = await m.protectForCurrentWindowsUser(value); const clear = await m.unprotectForCurrentWindowsUser(encrypted); if (!clear.equals(value)) process.exit(1); })"
      - name: arrêter le service windows
        if: always() && runner.os == 'Windows'
        run: node scripts/windows-service.cjs stop
